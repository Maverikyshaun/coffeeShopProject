<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visit — Caffè Bruno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="site-header" data-header>
    <a class="brand" href="/">Caffè Bruno</a>
    <button class="nav-toggle" type="button" aria-label="Menu" data-nav-toggle>
      <span></span><span></span>
    </button>
    <nav class="site-nav" data-nav>
      <a href="/menu">Menu</a>
      <a href="/gallery">Gallery</a>
      <a href="/about">About</a>
      <a class="active" href="/visit">Visit</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-media" style="--page-image: url('https://images.unsplash.com/photo-1481833761820-0509d3217039?w=1600&q=80')"></div>
      <div class="page-hero-content">
        <p class="hero-brand">Caffè Bruno</p>
        <h1>Visit</h1>
        <p>Planning a group, an event, or just want to say hello - drop us a line.</p>
      </div>
    </section>

    <section class="section visit-section">
      <form class="visit-form" data-visit-form>
        <label>
          Name
          <input name="name" required minlength="2" />
        </label>
        <label>
          Email
          <input name="email" type="email" required />
        </label>
        <label>
          Phone <span class="optional">optional</span>
          <input name="phone" />
        </label>
        <label>
          Party size <span class="optional">optional</span>
          <input name="party_size" type="number" min="1" max="100" />
        </label>
        <label>
          Occasion <span class="optional">optional</span>
          <input name="occasion" placeholder="Birthday, meeting, work session…" />
        </label>
        <label>
          Message
          <textarea name="message" rows="5" required minlength="5"></textarea>
        </label>
        <button class="btn" type="submit">Send inquiry</button>
        <p class="form-note" data-visit-message hidden></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">Caffè Bruno</div>
    <p>Coffee House &amp; Roastery</p>
    <div class="footer-links">
      <a href="/menu">Menu</a>
      <a href="/gallery">Gallery</a>
      <a href="/visit">Visit</a>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
