<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Caffè Bruno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="site-header" data-header>
    <a class="brand" href="/">Caffè Bruno</a>
    <button class="nav-toggle" type="button" aria-label="Menu" data-nav-toggle>
      <span></span><span></span>

    <nav class="site-nav" data-nav>

      <a class="active" href="/gallery">Gallery</a>

  <main>
    <section class="page-hero">
      <div class="page-hero-media" style="--page-image: url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=1600&q=80')"></div>

        <p class="hero-brand">Caffè Bruno</p>
        <h1>Gallery</h1>
        <p>The bar, the beans, and the corners worth lingering in.</p>
      </div>

    <section class="section">
      <div class="gallery-grid" data-gallery>
        <p class="loading">Loading…</p>
      </div>
    </section>

  <footer class="site-footer">
    <div class="footer-brand">Caffè Bruno</div>
    <p>Coffee House &amp; Roastery</p>
    <div class="footer-links">
      <a href="/menu">Menu</a>
      <a href="/gallery">Gallery</a>

  <script src="/static/js/app.js"></script>
